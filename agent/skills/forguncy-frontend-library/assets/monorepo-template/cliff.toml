# 更新日志
#
# 本文件由 git-cliff 依据 Conventional Commits 自动生成，请勿手工编辑。
# 重新生成：`vp run changelog`（同时会逐个生成 packages/<id>/CHANGELOG.md）。

# git-cliff 配置：https://git-cliff.org/docs/configuration
[changelog]
header = """
本文件由 git-cliff 依据 Conventional Commits 自动生成，请勿手工编辑（重新生成：`vp run changelog`）。
提交 scope 约定：包 id（如 `feat(tanstack-query): ...`）；跨基建改动用 `tooling`；仓库级改动可以不带 scope。
每个包的 CHANGELOG 只包含该包目录与 `tooling/` 下的改动。\n
"""
trim = true
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## [未发布]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }} (`{{ commit.id | truncate(length=8, end="") }}`)
{% endfor %}
{% endfor %}
"""
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = false
protect_breaking_commits = false
topo_order = false
sort_commits = "newest"
split_commits = false
ignore_tags = ""
date_order = false
tag_pattern = "v[0-9]*"

commit_preprocessors = [
  # 把 GitHub / MCP 自动生成的 "Signed-off-by" 等尾巴去掉，避免污染 changelog
  { pattern = "\\s*Signed-off-by:.*", replace = "" },
]

commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->新包 / 新能力" },
  { message = "^fix", group = "<!-- 1 -->缺陷修复" },
  { message = "^perf", group = "<!-- 2 -->性能" },
  { message = "^refactor", group = "<!-- 3 -->重构" },
  { message = "^docs", group = "<!-- 4 -->文档" },
  { message = "^test", group = "<!-- 5 -->测试" },
  { message = "^build", group = "<!-- 6 -->构建" },
  { message = "^ci", group = "<!-- 7 -->CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 8 -->杂项" },
  { body = ".*security", group = "<!-- 9 -->安全" },
]

# 说明：唯一被跳过的是 chore(release)（发版机器人提交）；
# docs / ci / 其他 chore 照常进日志，便于追溯文档、CI 与技能这类改动。
