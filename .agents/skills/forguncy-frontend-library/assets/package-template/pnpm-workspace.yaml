# pnpm 配置（项目级）。pnpm 11 只从这个文件读取构建脚本白名单，package.json 里的 pnpm 字段无效。
#
# 为什么必须有：pnpm 10.3 起 strictDepBuilds 默认开启，依赖的 pre/postinstall 脚本一律不执行，
# 未审查的构建会让 install 以 ERR_PNPM_IGNORED_BUILDS 退出。esbuild 的 postinstall 会生成
# node_modules/esbuild/index.js，被跳过时 build.mjs 直接 ERR_MODULE_NOT_FOUND，包根本构建不出来。
#
# 为什么用 allowBuilds 而不是 onlyBuiltDependencies：后者在 pnpm 11 已被移除，只有 allowBuilds 生效。
# allowBuilds 是「包名匹配器 → 布尔」的映射，未列出的包默认拒绝。
#
# 新增任何带 install 脚本的依赖（原生模块、字体/图标包等）时，都要在这里显式加一行 true 或 false。
allowBuilds:
  esbuild: true
