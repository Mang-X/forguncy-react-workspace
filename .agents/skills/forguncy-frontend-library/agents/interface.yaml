interface:
  display_name: "活字格前端扩展包打包专家"
  short_description: "把浏览器端 JS 类库变成活字格 ReactCellType 可上传、可运行的前端扩展包。"
  default_prompt: "Use $forguncy-frontend-library to build or fix a Forguncy ReactCellType frontend extension package (bundle.js, manifest.json, types.d.ts, globalName, upload)."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
