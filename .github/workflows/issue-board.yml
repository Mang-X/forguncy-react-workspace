name: Issue dependency board
on:
  pull_request:
    paths:
      - 'tools/issue-board/**'
      - '.github/workflows/issue-board.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'tools/issue-board/**'
      - '.github/workflows/issue-board.yml'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: '24'
          cache: true
          run-install: true
      - run: vp run board:test
      - name: Snapshot public GitHub issue data
        run: vp run board:snapshot
        env:
          GH_TOKEN: ${{ github.token }}
      - run: vp run board:build
      - uses: actions/upload-artifact@v4
        with:
          name: issue-dependency-board
          path: |
            dist/issue-board/index.html
            tools/issue-board/snapshot.json
          retention-days: 30
