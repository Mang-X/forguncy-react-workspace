name: Install Forguncy frontend-library Skill

on:
  push:
    branches:
      - chore/install-forguncy-frontend-skill

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/install-forguncy-frontend-skill
      - name: Install skill with skills CLI
        run: npx skills@latest add MangMax/forguncy-frontend-library -s forguncy-frontend-library -y
      - name: Commit installed skill
        run: |
          rm .github/workflows/install-forguncy-skill.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: install forguncy frontend-library skill"
          git push origin HEAD:chore/install-forguncy-frontend-skill
