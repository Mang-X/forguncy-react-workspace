name: Bootstrap issue dependency board
on:
  push:
    branches: [feat/36-issue-dependency-board]
    paths: [.github/workflows/bootstrap-issue-board.yml]
permissions:
  contents: write
  issues: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/36-issue-dependency-board
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore verified source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, lzma, os, pathlib, tarfile, urllib.request
          shas = ['53acb6a9df6ac4892ceb4b6246d59580313c487f', 'cac56d41061d0925089107b6bdff1aea561fa5a3', 'fd2c609deb0fd9b42770a27a7cdb75078f52654d', 'dedb1a5eb4d05277905c2a02a0b5206f6e42b143', 'fd27d99339edbe1c03d4cee3012d650f8da99543', 'f4120378b3027d9826635ed96f4db8a2013823af']
          pieces = []
          for sha in shas:
              req = urllib.request.Request('https://api.github.com/repos/Mang-X/forguncy-react-workspace/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  blob = json.load(r)
              pieces.append(base64.b64decode(blob['content']).decode('ascii'))
          packed = base64.b64decode(''.join(pieces), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '4b84e29e7e28802b23170ce56888b5b46dfa1cdcb49a9f7cd482721c05cabac9'
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(packed))) as archive:
              for member in archive.getmembers():
                  p = pathlib.Path(member.name)
                  assert not p.is_absolute() and '..' not in p.parts and member.isfile()
                  if str(p) == '.github/workflows/issue-board.yml':
                      assert p.read_bytes() == archive.extractfile(member).read(), 'Workflow was prepared separately'
                      continue
                  assert str(p).startswith('tools/issue-board/')
                  assert not p.exists(), 'Refuse to overwrite source: ' + str(p)
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(archive.extractfile(member).read())
          pkg = pathlib.Path('package.json')
          data = json.loads(pkg.read_text())
          data.setdefault('scripts', {}).update({'board:test': 'node --test tools/issue-board/model.test.mjs', 'board:snapshot': 'node tools/issue-board/snapshot.mjs', 'board:build': 'node tools/issue-board/build.mjs'})
          pkg.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          readme = pathlib.Path('README.md')
          readme.write_text(readme.read_text().rstrip() + '\n\n## Issue 依赖看板\n\n仓库内提供中文依赖图与代理任务分配辅助页面，代码位于 `tools/issue-board/`。\n\n```sh\nvp run board:test\nvp run board:snapshot\nvp run board:build\n```\n\n用浏览器打开 `dist/issue-board/index.html`；也可从 GitHub Actions 的 **Issue dependency board** 工作流下载同名构建产物。页面包含生成时的真实 Issue 快照，打开后会读取 GitHub 最新状态，并在页面可见时每 3 分钟刷新。\n\n支持依赖来源查看、就绪任务筛选、循环与缺失引用提示，以及复制代理任务说明。本机代理分配备注仅保存在当前浏览器，不会写回 GitHub 或实际启动代理；多人协作仍以 GitHub Issues 与 PR 为准。\n')
          PY
      - run: node --test tools/issue-board/model.test.mjs
      - name: Snapshot live GitHub data
        run: node tools/issue-board/snapshot.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node tools/issue-board/build.mjs
      - name: Commit ordinary source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/issue-board package.json README.md
          git commit -m 'feat: add Issue dependency dashboard (refs #36)'
          git push origin HEAD:feat/36-issue-dependency-board
      - uses: actions/upload-artifact@v4
        with:
          name: issue-dependency-board
          path: |
            dist/issue-board/index.html
            tools/issue-board/snapshot.json
          retention-days: 30
