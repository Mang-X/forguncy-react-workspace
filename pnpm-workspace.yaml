packages:
  - packages/*
  - examples/*
  # The workspace-package PoC (#15) ships its own shared packages, so the graph
  # the compiler resolves through is the same one `pnpm install` links. A second
  # glob here rather than one more entry in `examples/*` keeps the PoC's shared
  # source inside the PoC that consumes it.
  - examples/workspace-package/packages/*

allowBuilds:
  esbuild: true
  # `@swc/core` ships a native binary, and the dev harness's React Fast Refresh plugin
  # (@vitejs/plugin-react-swc) is what loads it. Without the build script the binary is
  # never installed and Fast Refresh silently degrades to a full page reload — the
  # criterion #23 is graded on, failing in the direction that looks like it worked.
  "@swc/core": true
